name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The `prepare` script installs husky's git hooks. They are for local use, and a
# CI runner has nothing to hook into.
env:
  HUSKY: 0

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines declares ">=20"; 24 is also the current local dev runtime.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun run <script>` honours the node shebang on the installed binaries, so
      # tsc, vitest and biome all execute under this Node — which is what makes
      # the matrix meaningful rather than decorative.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: bun install --frozen-lockfile

      # Must precede the typecheck: src/typesense.integration.test.ts imports
      # ../dist/index.js by design, so dist is an input to `tsc --noEmit`. On a
      # clean checkout the typecheck fails with TS2307 until this has run.
      - name: Build
        run: bun run build

      # Deliberately separate from the test run: vitest transpiles without
      # typechecking, which is how the optional-field inference bug stayed
      # invisible behind a green suite.
      - name: Typecheck
        run: bun run typecheck

      # Invoked directly rather than through `bun run lint`, whose --write flag
      # would rewrite the checkout instead of failing the build.
      - name: Lint
        run: bunx biome lint src

      - name: Format check
        run: bunx biome format src

      - name: Unit tests
        run: bun run test

      # Proves both published outputs actually load on every Node the engines field
      # promises, that the DI classes kept their decorator metadata — tsc emits
      # design:paramtypes, esbuild-based bundlers do not — and that loading the two
      # copies together does not split the injection tokens.
      - name: Smoke-test both built outputs
        run: |
          cat > smoke.mjs <<'SMOKE'
          import { createRequire } from 'node:module'
          import { readFileSync } from 'node:fs'
          import 'reflect-metadata'

          const require = createRequire(import.meta.url)

          // Checked before anything is loaded. Node 22+ reparses a stray ESM file as a module
          // when it sees module syntax, so a missing marker would let `import()` succeed here
          // and only fail for consumers on Node 20 — as a bare SyntaxError, far from the cause.
          for (const [dir, expected] of [['cjs', 'commonjs'], ['esm', 'module']]) {
            const marker = JSON.parse(readFileSync(`./dist/${dir}/package.json`, 'utf8'))
            if (marker.type !== expected)
              throw new Error(`dist/${dir}/package.json declares type ${marker.type}, expected ${expected}`)
          }

          const cjs = require('./dist/cjs/index.js')
          const esm = await import('./dist/esm/index.js')

          // The markers say what the directories claim; this checks what tsc actually emitted.
          if (!/^export /m.test(readFileSync('./dist/esm/index.js', 'utf8')))
            throw new Error('dist/esm/index.js has no ESM export statement — the ESM pass emitted CommonJS')
          if (!/require\(/.test(readFileSync('./dist/cjs/index.js', 'utf8')))
            throw new Error('dist/cjs/index.js has no require() call — the CJS pass emitted ESM')

          const required = [
            'TypesenseModule', 'TypesenseClient', 'TypesenseIndexer', 'TypesenseCollections',
            'defineCollection', 'field', 'TypesenseSchema',
          ]

          for (const [label, pkg] of [['cjs', cjs], ['esm', esm]]) {
            const missing = required.filter((k) => pkg[k] === undefined)
            if (missing.length) throw new Error(label + ' missing exports: ' + missing.join(', '))

            const meta = Reflect.getMetadata('design:paramtypes', pkg.TypesenseClient)
            if (!meta) throw new Error(label + ' lost design:paramtypes — NestJS DI would break at runtime')
          }

          // Both builds loaded at once must agree on the injection tokens, or @Inject in one
          // copy silently fails to match the provider registered by the other.
          for (const token of ['TYPESENSE_MODULE_OPTIONS', 'TYPESENSE_CLIENT', 'TYPESENSE_COLLECTIONS']) {
            if (cjs[token] !== esm[token]) throw new Error('token ' + token + ' differs across the CJS and ESM copies')
          }

          console.log('cjs + esm load on node ' + process.versions.node + ', DI metadata intact, tokens shared')
          SMOKE
          node smoke.mjs
          rm smoke.mjs

  integration:
    name: integration (live typesense)
    runs-on: ubuntu-latest

    env:
      TYPESENSE_HOST: localhost
      TYPESENSE_PORT: '8108'
      TYPESENSE_API_KEY: xyz

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: bun install --frozen-lockfile

      # Started with `docker run` rather than as a job `services:` container.
      # A service container cannot override the image's command, and Typesense
      # needs --data-dir pointing at a directory that actually exists; without
      # it the container exits(1) before ever binding the port. These are the
      # same arguments docker-compose.yml uses for local runs.
      - name: Start Typesense
        run: |
          docker run -d --name typesense \
            -p 8108:8108 \
            -v /tmp/typesense-data:/data \
            typesense/typesense:29.0 \
            --data-dir /data --api-key=xyz --enable-cors

      # Polled from the runner rather than via a container healthcheck: the
      # image is not guaranteed to ship curl, so a healthcheck shelling out to
      # it can wedge the job instead of failing it.
      - name: Wait for Typesense
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:8108/health" > /dev/null 2>&1; then
              echo "Typesense answered after ${i}s: $(curl -fsS http://localhost:8108/health)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Typesense never became healthy on :8108"
          docker ps -a
          echo '--- container logs ---'
          docker logs typesense 2>&1 | tail -50
          exit 1

      # Builds dist first, then runs the suite against the service container.
      # The suite throws rather than skipping when nothing answers, so a green
      # job is proof the server was actually reached.
      - name: Integration tests
        run: bun run test:integration
